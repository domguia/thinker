<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="820" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#111">Thinker: one recurrent step</text>

  <!-- Static input encoding block -->
  <rect x="60" y="90" width="260" height="120" rx="10" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3d6d">Input encoding (once)</text>
  <text x="190" y="150" text-anchor="middle" font-size="16" fill="#1a3d6d">Input X  →  Embeddings E</text>
  <text x="190" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3d6d">K_in, V_in = Linear_in(E)</text>

  <!-- arrow down to loop -->
  <line x1="190" y1="210" x2="190" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recurrent loop box -->
  <rect x="60" y="255" width="1000" height="430" rx="12" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="285" font-size="18" font-weight="bold" fill="#333">Thinking step t = 1 … N_step  (weights shared across steps)</text>

  <!-- Z_{t-1} -->
  <rect x="90" y="320" width="180" height="80" rx="10" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="180" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Z(t-1)</text>
  <text x="180" y="378" text-anchor="middle" font-size="14" fill="#555">latent state</text>

  <line x1="270" y1="360" x2="330" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q_t block -->
  <rect x="330" y="320" width="200" height="80" rx="10" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="430" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Q_t</text>
  <text x="430" y="372" text-anchor="middle" font-size="13" fill="#555">LayerNorm + Linear_q</text>
  <text x="430" y="390" text-anchor="middle" font-size="13" fill="#555">of Z(t-1)</text>

  <line x1="530" y1="360" x2="590" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cross-attention block -->
  <rect x="590" y="300" width="260" height="120" rx="10" fill="#fff3e0" stroke="#c77700" stroke-width="2"/>
  <text x="720" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4a00">Cross-attention</text>
  <text x="720" y="355" text-anchor="middle" font-size="13" fill="#7a4a00">softmax(Q_t · K_t^T / √d) · V_t</text>
  <text x="720" y="378" text-anchor="middle" font-size="13" fill="#7a4a00">K_t = [K_in, K_mem]</text>
  <text x="720" y="398" text-anchor="middle" font-size="13" fill="#7a4a00">V_t = [V_in, V_mem]</text>

  <!-- arrow from input cache up into attention -->
  <line x1="190" y1="210" x2="190" y2="230" stroke="none"/>
  <path d="M320 150 C 500 150, 590 250, 660 300" fill="none" stroke="#3b6fb6" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="850" y1="360" x2="910" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Z_t update block -->
  <rect x="910" y="320" width="130" height="80" rx="10" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="975" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Z_t</text>
  <text x="975" y="372" text-anchor="middle" font-size="12" fill="#555">Z(t-1) +</text>
  <text x="975" y="388" text-anchor="middle" font-size="12" fill="#555">MLP(LN(A_t))</text>

  <!-- Memory cache block, below attention -->
  <rect x="590" y="480" width="260" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="510" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Memory cache</text>
  <text x="720" y="534" text-anchor="middle" font-size="13" fill="#1b5e20">K_mem,t = [K_mem,t-1, Linear_mem(Z_t)]</text>
  <text x="720" y="554" text-anchor="middle" font-size="13" fill="#1b5e20">V_mem,t = [V_mem,t-1, Linear_mem(Z_t)]</text>
  <text x="720" y="580" text-anchor="middle" font-size="12" fill="#1b5e20">grows by one slot every step</text>

  <!-- arrow Z_t -> memory update -->
  <path d="M975 400 C 975 460, 850 470, 850 480" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- arrow memory cache feeds back into cross-attention (K_mem, V_mem) -->
  <path d="M720 480 C 720 450, 700 430, 690 420" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- loop-back arrow: Z_t -> next Z_{t-1}, routed with right-angle turns below the memory cache box (bottom edge y=610) to stay clear of all text -->
  <path d="M975 400 L975 645 L180 645 L180 400" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="430" y="630" width="300" height="22" fill="white"/>
  <text x="580" y="646" text-anchor="middle" font-size="14" fill="#444">repeat: Z_t becomes Z(t-1) of the next step</text>

  <!-- Output -->
  <line x1="975" y1="400" x2="975" y2="440" stroke="none"/>
  <line x1="1040" y1="360" x2="1100" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <rect x="1100" y="320" width="240" height="80" rx="10" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="2"/>
  <text x="1220" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3d6d">Output (after N_step)</text>
  <text x="1220" y="376" text-anchor="middle" font-size="13" fill="#1a3d6d">decode from Z(N_step)</text>

  <!-- Legend -->
  <rect x="90" y="700" width="940" height="90" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <rect x="110" y="720" width="18" height="18" fill="#eaf2ff" stroke="#3b6fb6"/>
  <text x="136" y="734" font-size="14" fill="#333">Static input path (computed once)</text>
  <rect x="110" y="748" width="18" height="18" fill="#f5f5f5" stroke="#555"/>
  <text x="136" y="762" font-size="14" fill="#333">Latent state Z</text>
  <rect x="420" y="720" width="18" height="18" fill="#fff3e0" stroke="#c77700"/>
  <text x="446" y="734" font-size="14" fill="#333">Cross-attention over input + memory</text>
  <rect x="420" y="748" width="18" height="18" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="446" y="762" font-size="14" fill="#333">Growing memory cache (persists across steps)</text>
  <text x="750" y="734" font-size="13" fill="#666">d = hidden dim, L = number of latents,</text>
  <text x="750" y="752" font-size="13" fill="#666">N_step = number of thinking steps</text>
</svg>
